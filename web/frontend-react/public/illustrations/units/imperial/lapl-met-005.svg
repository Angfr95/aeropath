<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Reconnaître les grandes formes de nuages</title><desc id="desc">Comparaison de nuages en couches, de nuages cumuliformes et d’un cumulonimbus à développement vertical.</desc>
