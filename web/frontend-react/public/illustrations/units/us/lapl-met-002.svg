<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Recalage : comprendre le sens</title><desc id="desc">Recalage : comprendre le sens</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / LAPL / COMPRENDRE EN IMAGE</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Recalage : comprendre le sens</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Exercice fictif · Schéma non à l’échelle</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LAPL_MET_002</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Schéma pédagogique · Données d’exercice, sauf mention contraire</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relier le schéma aux explications et aux références de la leçon.</text>
<text x="65" y="213" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Même avion · Même position · Même pression statique</text>
<rect x="65" y="246" width="480" height="202" rx="12" fill="#1c344b" stroke="none"/>
<text x="93" y="284" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Avant</text>
<text x="93" y="346" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start">1 500 ft</text>
<text x="93" y="405" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Calage : 1005 hPa</text>
<rect x="650" y="246" width="480" height="202" rx="12" fill="#1c344b" stroke="none"/>
<text x="678" y="284" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Après</text>
<text x="678" y="346" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start">1 770 ft</text>
<text x="678" y="405" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Calage : 1015 hPa</text>
<path d="M560 345L630 345" fill="none" stroke="#ffcd70" stroke-width="4"/>
<path d="M630.0 345.0L616.5 351.5L616.5 338.5Z" fill="#ffcd70" stroke="#ffcd70" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<text x="65" y="495" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Modèle fourni : +10 hPa × 27 ft/hPa = +270 ft indiqués</text>
<text x="65" y="546" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">L’avion ne monte pas parce que le nombre augmente. Cette approximation de basses</text>
<text x="65" y="576" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">couches ne corrige pas l’effet du froid.</text>
</svg>
