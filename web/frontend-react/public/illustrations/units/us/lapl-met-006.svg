<rect x="211" y="454" width="35" height="40" rx="0" fill="rgba(20,40,60,1)" stroke="none"/>
<text x="234" y="235" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BON CONTRASTE</text>
