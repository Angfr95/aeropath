<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Altimétrie : vérifier une marge</title><desc id="desc">Altimétrie : vérifier une marge</desc>
