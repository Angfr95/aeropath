<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Menaces, erreurs et protections</title><desc id="desc">Une menace peut favoriser une erreur ; préparation, checklist et recoupement forment des protections pour éviter une situation dégradée.</desc>
