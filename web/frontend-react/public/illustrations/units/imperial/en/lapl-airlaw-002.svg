<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Identify the regulatory framework</title><desc id="desc">Comparison of European and US frameworks and the checks needed to fly under a different framework.</desc>
