<text x="964" y="235" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">FAIBLE CONTRASTE</text>
<text x="600" y="572" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">Les mêmes repères deviennent plus difficiles à reconnaître.</text>
