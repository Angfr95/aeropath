<circle cx="610" cy="443" r="10" fill="#ffcd70" stroke="#ffcd70" stroke-width="2"/>
<text x="610" y="303" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">AIR</text>
