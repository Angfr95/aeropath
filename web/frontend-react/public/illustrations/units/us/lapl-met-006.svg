<text x="599" y="235" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BRUME</text>
<rect x="792" y="260" width="344" height="260" rx="10" fill="#496575" stroke="none"/>
<path d="M792 493L862 363L937 448L1012 318L1136 494Z" fill="#152b40" stroke="#152b40" stroke-width="1" stroke-linejoin="round" opacity="0.14"/>
