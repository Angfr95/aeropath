<text x="85" y="590" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Modèle : n = 1 / cos φ ; Vs,n = Vs,1 × √n. Masse et configuration fixées.</text>
