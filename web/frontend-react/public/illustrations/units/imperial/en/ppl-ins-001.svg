<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Four speeds, four references</title><desc id="desc">Simplified IAS, CAS, TAS and groundspeed sequence; TAS 110 kt with an aligned 20 kt headwind gives 90 kt groundspeed.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / PPL / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Four speeds, four references</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Choose the correct speed for aircraft control and navigation calculations.</text>
