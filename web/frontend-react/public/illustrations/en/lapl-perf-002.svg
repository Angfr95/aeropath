<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Same climb rate, different gradient</title><desc id="desc">At 450 ft/min, 90 kt groundspeed gives 300 ft/NM; 120 kt gives 225 ft/NM for the same height gain.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / LAPL / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Same climb rate, different gradient</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Compare height gained with distance actually travelled over the ground.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LAPL_PERF_002</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Training diagram · Exercise data unless stated otherwise</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relate the diagram to the lesson&#x27;s explanations and references.</text>
<path d="M111 544L777 544" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<path d="M111 544L111 229" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<path d="M111 258L745 258" fill="none" stroke="#a9bdd3" stroke-width="1" stroke-dasharray="7 7"/>
<path d="M111 544L534 258" fill="none" stroke="#58dfed" stroke-width="5"/>
<path d="M534.0 258.0L526.5 271.0L519.2 260.2Z" fill="#58dfed" stroke="#58dfed" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<path d="M111 544L675 258" fill="none" stroke="#ffcd70" stroke-width="5"/>
<path d="M675.0 258.0L665.9 269.9L660.0 258.3Z" fill="#ffcd70" stroke="#ffcd70" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<path d="M534 258L534 544" fill="none" stroke="#58dfed" stroke-width="1" stroke-dasharray="7 7"/>
<path d="M675 258L675 544" fill="none" stroke="#ffcd70" stroke-width="1" stroke-dasharray="7 7"/>
<text x="109" y="225" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">450 ft gained in 1 min</text>
<text x="442" y="348" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">90 kt groundspeed</text>
<text x="542" y="419" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">120 kt groundspeed</text>
<text x="534" y="578" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">1.5 NM</text>
<text x="697" y="578" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">2 NM</text>
<path d="M829 205L829 583" fill="none" stroke="#304961" stroke-width="1"/>
<circle cx="864" cy="224" r="5" fill="#58dfed" stroke="#58dfed" stroke-width="2"/>
<text x="883" y="230" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Same climb rate</text>
<text x="855" y="262" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">450 ft/min in this</text>
<text x="855" y="288" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">exercise.</text>
<circle cx="864" cy="342" r="5" fill="#ffcd70" stroke="#ffcd70" stroke-width="2"/>
<text x="883" y="348" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">At 90 kt groundspeed</text>
<text x="855" y="380" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">450 / 1.5 = 300 ft/NM.</text>
<circle cx="864" cy="460" r="5" fill="#bbabff" stroke="#bbabff" stroke-width="2"/>
<text x="883" y="466" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">At 120 kt groundspeed</text>
<text x="855" y="498" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">450 / 2 = 225 ft/NM:</text>
<text x="855" y="524" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">shallower gradient.</text>
</svg>
