<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Quatre vitesses, quatre références</title><desc id="desc">Chaîne simplifiée IAS, CAS, TAS et vitesse sol ; une TAS de 110 kt avec 20 kt de vent de face dans l’axe donne 90 kt sol.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / LAPL / COMPRENDRE EN IMAGE</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Quatre vitesses, quatre références</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Choisir la bonne vitesse pour le pilotage et les calculs de navigation.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LAPL_INS_001</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Schéma pédagogique · Données d’exercice, sauf mention contraire</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relier le schéma aux explications et aux références de la leçon.</text>
<circle cx="180" cy="312" r="69" fill="#1c324c" stroke="#58dfed" stroke-width="3"/>
<text x="180" y="322" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">IAS</text>
<text x="180" y="425" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Vitesse indiquée</text>
<path d="M256 312L307 312" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<path d="M307.0 312.0L293.5 318.5L293.5 305.5Z" fill="#a9bdd3" stroke="#a9bdd3" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<circle cx="460" cy="312" r="69" fill="#1c324c" stroke="#ffcd70" stroke-width="3"/>
<text x="460" y="322" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">CAS</text>
<text x="460" y="425" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Erreurs corrigées</text>
<path d="M536 312L587 312" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<path d="M587.0 312.0L573.5 318.5L573.5 305.5Z" fill="#a9bdd3" stroke="#a9bdd3" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<circle cx="740" cy="312" r="69" fill="#1c324c" stroke="#bbabff" stroke-width="3"/>
<text x="740" y="322" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">TAS</text>
<text x="740" y="425" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Vitesse dans l’air</text>
<path d="M816 312L867 312" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<path d="M867.0 312.0L853.5 318.5L853.5 305.5Z" fill="#a9bdd3" stroke="#a9bdd3" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<circle cx="1020" cy="312" r="69" fill="#1c324c" stroke="#58dfed" stroke-width="3"/>
<text x="1020" y="322" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">SOL</text>
<text x="1020" y="425" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Déplacement au sol</text>
<text x="320" y="234" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Instrument / position</text>
<text x="600" y="234" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Atmosphère*</text>
<text x="880" y="234" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Vent</text>
<text x="600" y="518" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">110 kt dans l’air − 20 kt de face = 90 kt sol</text>
<text x="600" y="575" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">* Chaîne simplifiée aux vitesses usuelles d’un avion école ; voir aussi EAS dans la leçon.</text>
</svg>
