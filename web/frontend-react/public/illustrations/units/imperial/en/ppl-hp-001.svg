<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Assess fitness on the day</title><desc id="desc">Assess physical condition, fatigue and mental workload before flight, then adapt the decision to their combination.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / PPL / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Assess fitness on the day</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Factors combine; administrative fitness alone is insufficient.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">PPL_HP_001</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Training diagram · Exercise data unless stated otherwise</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relate the diagram to the lesson&#x27;s explanations and references.</text>
<rect x="60" y="208" width="350" height="368" rx="14" fill="#192d45" stroke="#324963"/>
<path d="M118 234L153 250V278Q148 302 118 317Q88 302 83 278V250Z" fill="none" stroke="#58dfed" stroke-width="3" stroke-linejoin="round" opacity="1"/>
<path d="M101 274L115 289L139 259" fill="none" stroke="#58dfed" stroke-width="4" stroke-linejoin="round" opacity="1"/>
<text x="365" y="241" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end">01</text>
<text x="84" y="357" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Physical condition</text>
<text x="84" y="411" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Assess health, medication</text>
<text x="84" y="443" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">and general condition.</text>
<rect x="425" y="208" width="350" height="368" rx="14" fill="#192d45" stroke="#324963"/>
<circle cx="483" cy="274" r="35" fill="#14253b" stroke="#ffcd70" stroke-width="3"/>
<path d="M483 274L483 251" fill="none" stroke="#ffcd70" stroke-width="4"/>
<path d="M483 274L503 286" fill="none" stroke="#ffcd70" stroke-width="4"/>
<text x="730" y="241" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end">02</text>
<text x="449" y="357" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Rest and recovery</text>
<text x="449" y="411" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Sleep, fatigue and</text>
<text x="449" y="443" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">planned flight duration.</text>
<rect x="790" y="208" width="350" height="368" rx="14" fill="#192d45" stroke="#324963"/>
<path d="M803 274Q848 229 893 274Q848 319 803 274Z" fill="none" stroke="#bbabff" stroke-width="3" stroke-linejoin="round" opacity="1"/>
<circle cx="848" cy="274" r="14" fill="#bbabff" stroke="#bbabff" stroke-width="2"/>
<text x="1095" y="241" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end">03</text>
<text x="814" y="357" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Mental workload</text>
<text x="814" y="411" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Stress, external pressure</text>
<text x="814" y="443" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">and task difficulty.</text>
