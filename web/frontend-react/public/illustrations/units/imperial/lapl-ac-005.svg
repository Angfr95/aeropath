<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">À chaque équipement sa fonction</title><desc id="desc">La VHF sert aux échanges vocaux, le transpondeur à la surveillance et le GNSS au positionnement et à la navigation.</desc>
