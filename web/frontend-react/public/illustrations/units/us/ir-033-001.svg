<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822" viewBox="0 0 1200 822" role="img" aria-labelledby="title desc"><title id="title">Préparation IFR : journal de navigation</title><desc id="desc">Préparation IFR : journal de navigation</desc>
