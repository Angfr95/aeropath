<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Identifier le cadre réglementaire</title><desc id="desc">Comparaison du cadre européen, du cadre américain et des vérifications nécessaires pour voler dans un autre cadre.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
