<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Distinguer hauteur et altitude</title><desc id="desc">Terrain à 600 ft au-dessus du niveau de la mer. Base des nuages à 1500 ft au-dessus du terrain. Altitude de la base à déterminer.</desc>
