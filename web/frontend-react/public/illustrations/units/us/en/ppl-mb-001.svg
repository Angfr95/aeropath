<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="852" viewBox="0 0 1200 852" role="img" aria-labelledby="title desc"><title id="title">Calculating centre of gravity</title><desc id="desc">600 kg at an arm of 1 m and 100 kg at 2 m give a centre of gravity approximately 1.143 m from the datum.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / PPL / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Calculating centre of gravity</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Simplified example: always compare with the approved envelope afterwards.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">PPL_MB_001</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Training diagram · Exercise data unless stated otherwise</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relate the diagram to the lesson&#x27;s explanations and references.</text>
<path d="M130 405L780 405" fill="none" stroke="#9ab1c8" stroke-width="8"/>
<path d="M130 390L130 426" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<text x="130" y="458" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">0 m</text>
<path d="M430 390L430 426" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<text x="430" y="458" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">1 m</text>
<path d="M730 390L730 426" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<text x="730" y="458" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">2 m</text>
<rect x="345" y="268" width="170" height="128" rx="12" fill="#235363" stroke="#58dfed"/>
<text x="430" y="331" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">600 kg</text>
<rect x="680" y="328" width="100" height="68" rx="12" fill="#574c38" stroke="#ffcd70"/>
<text x="730" y="368" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">100 kg</text>
<path d="M473 413L449 490H497Z" fill="#bbabff" stroke="#bbabff" stroke-width="2" stroke-linejoin="round" opacity="1"/>
<text x="473" y="521" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">CG ≈ 1.143 m</text>
<text x="453" y="574" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle">(600 × 1 + 100 × 2) / 700 = 1.143 m</text>
<path d="M829 205L829 583" fill="none" stroke="#304961" stroke-width="1"/>
<circle cx="864" cy="224" r="5" fill="#58dfed" stroke="#58dfed" stroke-width="2"/>
<text x="883" y="230" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Moment</text>
<text x="855" y="262" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Mass × arm: kg·m.</text>
<circle cx="864" cy="342" r="5" fill="#ffcd70" stroke="#ffcd70" stroke-width="2"/>
<text x="883" y="348" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Centre of gravity</text>
<text x="855" y="380" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Total moments / total mass.</text>
<circle cx="864" cy="460" r="5" fill="#bbabff" stroke="#bbabff" stroke-width="2"/>
<text x="883" y="466" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Validation</text>
<text x="855" y="498" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Compare the result with the</text>
<text x="855" y="524" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">manual&#x27;s envelope.</text>
<rect x="0" y="720" width="1200" height="132" fill="#10243d"/><text x="42" y="754" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="18">Rounded equivalents · original values retained for calculations</text><text x="42" y="786" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">0 m ≈ 0 ft</text><text x="432" y="786" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">1 m ≈ 3.28 ft</text><text x="822" y="786" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">2 m ≈ 6.56 ft</text><text x="42" y="816" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">600 kg ≈ 1,322.77 lb</text><text x="432" y="816" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">100 kg ≈ 220.46 lb</text><text x="822" y="816" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="17">1.143 m ≈ 3.75 ft</text></svg>
