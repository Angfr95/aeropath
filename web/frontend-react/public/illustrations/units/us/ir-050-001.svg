<text x="65" y="515" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">8 kg disponibles pour ces segments ; besoins ultérieurs protégés. Profils fixes.</text>
