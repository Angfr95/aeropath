name: CD

# Production updates are explicit and use the guarded content-aware deploy script.
on:
  workflow_dispatch:

concurrency:
  group: aeropath-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable API and compiled frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/angfr95/aeropath-api:${{ github.sha }}
      - name: Deploy verified release on the existing VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: RELEASE_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/aeropath
            git fetch origin "$RELEASE_SHA"
            release="/opt/aeropath/releases/$RELEASE_SHA"
            test ! -e "$release"
            mkdir -p "$release"
            git archive "$RELEASE_SHA" | tar -x -C "$release"
            image="ghcr.io/angfr95/aeropath-api:$RELEASE_SHA"
            docker pull "$image"
            sudo -n bash "$release/deployments/aws/deploy-existing-vm.sh" "$release" "$image"
