<text x="390" y="492" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">10 °C</text>
<path d="M500 435L500 462" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<text x="500" y="492" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">11 °C</text>
<path d="M610 435L610 462" fill="none" stroke="#a9bdd3" stroke-width="2"/>
<text x="610" y="492" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">12 °C</text>
