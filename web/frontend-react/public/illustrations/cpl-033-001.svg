<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Carburant : comparer trois options</title><desc id="desc">Carburant : comparer trois options</desc>
