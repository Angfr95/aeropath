<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Le plus proche n’est pas toujours le plus rapide</title><desc id="desc">Le terrain A est à 24 NM et 80 kt sol, soit 18 minutes ; B est à 30 NM et 120 kt sol, soit 15 minutes. Vérifier aussi leur utilisabilité.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / LAPL / COMPRENDRE EN IMAGE</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Le plus proche n’est pas toujours le plus rapide</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Comparer temps, accessibilité et conditions d’utilisation.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LAPL_EMG_001</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Schéma pédagogique · Données d’exercice, sauf mention contraire</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relier le schéma aux explications et aux références de la leçon.</text>
<g transform="translate(195 401) rotate(90) scale(0.65)">
<path d="M0-80C-12-74-13-45-10-20L-85 17-85 30-10 15-6 58-30 75-30 83 0 74 30 83 30 75 6 58 10 15 85 30 85 17 10-20C13-45 12-74 0-80Z" fill="#edf5ff" stroke="#7895b3" stroke-width="2" stroke-linejoin="round" opacity="1"/>
<path d="M-6-42Q0-51 6-42L6-25H-6Z" fill="#18324c" stroke="#18324c" stroke-width="1" stroke-linejoin="round" opacity="1"/>
</g>
<path d="M280 380L700 279" fill="none" stroke="#58dfed" stroke-width="4"/>
<path d="M700.0 279.0L688.4 288.5L685.3 275.8Z" fill="#58dfed" stroke="#58dfed" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<path d="M280 433L742 535" fill="none" stroke="#ffcd70" stroke-width="4"/>
<path d="M742.0 535.0L727.4 538.5L730.2 525.7Z" fill="#ffcd70" stroke="#ffcd70" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<circle cx="702" cy="279" r="13" fill="#58dfed" stroke="#58dfed" stroke-width="2"/>
<circle cx="744" cy="535" r="13" fill="#ffcd70" stroke="#ffcd70" stroke-width="2"/>
<text x="430" y="281" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">A : 24 NM / 80 kt</text>
<text x="432" y="316" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle">18 minutes</text>
<text x="515" y="429" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">B : 30 NM / 120 kt</text>
<text x="515" y="462" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle">15 minutes</text>
<path d="M829 205L829 583" fill="none" stroke="#304961" stroke-width="1"/>
<circle cx="864" cy="224" r="5" fill="#58dfed" stroke="#58dfed" stroke-width="2"/>
<text x="883" y="230" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Distance ≠ temps</text>
<text x="855" y="262" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Le terrain plus loin peut</text>
<text x="855" y="288" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">être plus rapide à</text>
<text x="855" y="314" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">rejoindre.</text>
<circle cx="864" cy="342" r="5" fill="#ffcd70" stroke="#ffcd70" stroke-width="2"/>
<text x="883" y="348" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Comparer aussi</text>
<text x="855" y="380" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Météo, relief, piste, vent</text>
<text x="855" y="406" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">et horaires.</text>
<circle cx="864" cy="460" r="5" fill="#bbabff" stroke="#bbabff" stroke-width="2"/>
<text x="883" y="466" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Décider tôt</text>
<text x="855" y="498" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Conserver du temps et du</text>
<text x="855" y="524" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">carburant pour les options.</text>
</svg>
