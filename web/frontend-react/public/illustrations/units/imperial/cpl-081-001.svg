<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Virage en palier : modèle</title><desc id="desc">Virage en palier : modèle</desc>
