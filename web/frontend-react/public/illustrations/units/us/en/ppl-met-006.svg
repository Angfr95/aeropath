<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Visibility also depends on contrast</title><desc id="desc">Three views of the same terrain show progressively reduced contrast, making landmarks and obstacles harder to distinguish.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / PPL / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">Visibility also depends on contrast</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">The same landscape can become hard to interpret.</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">PPL_MET_006</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Training diagram · Exercise data unless stated otherwise</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Relate the diagram to the lesson&#x27;s explanations and references.</text>
<rect x="62" y="260" width="344" height="260" rx="10" fill="#496575" stroke="none"/>
<path d="M62 493L132 363L207 448L282 318L406 494Z" fill="#152b40" stroke="#152b40" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<rect x="211" y="454" width="35" height="40" rx="0" fill="rgba(20,40,60,1)" stroke="none"/>
<text x="234" y="235" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">GOOD CONTRAST</text>
<rect x="427" y="260" width="344" height="260" rx="10" fill="#496575" stroke="none"/>
<path d="M427 493L497 363L572 448L647 318L771 494Z" fill="#152b40" stroke="#152b40" stroke-width="1" stroke-linejoin="round" opacity="0.45"/>
<rect x="576" y="454" width="35" height="40" rx="0" fill="rgba(20,40,60,0.45)" stroke="none"/>
<text x="599" y="235" fill="#ffcd70" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">HAZE</text>
<rect x="792" y="260" width="344" height="260" rx="10" fill="#496575" stroke="none"/>
<path d="M792 493L862 363L937 448L1012 318L1136 494Z" fill="#152b40" stroke="#152b40" stroke-width="1" stroke-linejoin="round" opacity="0.14"/>
<rect x="941" y="454" width="35" height="40" rx="0" fill="rgba(20,40,60,0.14)" stroke="none"/>
<text x="964" y="235" fill="#bbabff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">LOW CONTRAST</text>
<text x="600" y="572" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle">The same landmarks become harder to recognise.</text>
</svg>
