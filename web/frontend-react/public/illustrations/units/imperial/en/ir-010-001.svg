<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">IFR minima: choose the applicable rule</title><desc id="desc">IFR minima: choose the applicable rule</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#bg)" stroke="none"/>
<text x="42" y="45" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">AEROPATH / IR / VISUAL LEARNING</text>
<text x="42" y="96" fill="#edf5ff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start">IFR minima: choose the applicable rule</text>
<text x="42" y="135" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Fictional exercise · Diagram not to scale</text>
<rect x="32" y="170" width="1136" height="450" rx="20" fill="#14253b" stroke="#2b415d"/>
<text x="42" y="668" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">IR_010_001</text>
<text x="1158" y="668" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end">Training diagram · Exercise data unless stated otherwise</text>
<text x="42" y="697" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Read the diagram with the lesson explanations and references.</text>
<text x="85" y="235" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Except as necessary for take-off/landing or specifically authorised by the</text>
<text x="85" y="265" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">authority.</text>
<text x="85" y="340" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">State-established minimum → apply that minimum</text>
<text x="85" y="410" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Otherwise: mountain/high terrain → obstacle + 2,000 ft</text>
<text x="85" y="480" fill="#58dfed" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Otherwise, elsewhere → obstacle + 1,000 ft</text>
<text x="85" y="550" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Fallback rule: highest obstacle within 8 km of estimated position. Account for navigation</text>
<text x="85" y="577" fill="#a9bdd3" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">accuracy.</text>
</svg>
