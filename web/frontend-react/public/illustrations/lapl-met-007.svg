<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Le soulèvement à une limite frontale</title><desc id="desc">Coupe schématique d’une limite entre air froid et air chaud ; le soulèvement peut produire nuages et précipitations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#080f1e"/></linearGradient></defs>
