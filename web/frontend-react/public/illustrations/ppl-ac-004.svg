<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Les instruments et leurs pressions</title><desc id="desc">L’anémomètre reçoit pression totale et statique ; l’altimètre et le variomètre utilisent la source statique.</desc>
